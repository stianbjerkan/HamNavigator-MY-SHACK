name: HamNavigator Portable ARM64
on:
  push:
    paths:
      - 'raspberry-pi/**'
      - '.github/workflows/pi-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - name: Install build and smoke-test dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git curl unzip build-essential qtbase5-dev qt5-qmake libqt5websockets5-dev libasound2-dev libpulse-dev libfftw3-dev python3-cryptography python3-tk xauth xvfb file ccache dbus-x11 gnome-keyring python3-keyring
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/hn-ccache
          key: pi-bookworm-arm64-digital-v1-${{ github.run_id }}
          restore-keys: pi-bookworm-arm64-digital-v1-
      - name: Build native Digital
        run: |
          cd raspberry-pi
          curl --fail --location --retry 3 -o /tmp/digital.zip https://github.com/stianbjerkan/HamNavigator-MY-SHACK/releases/download/v1.9.23/HamNavigator-Digital-kildekode.zip
          echo 'f955f399672020010537b329a40f90638f213faa5338fc0d6b2a6c1126f5812e  /tmp/digital.zip' | sha256sum -c -
          unzip -q /tmp/digital.zip -d /tmp/hn-src
          python3 prepare.py /tmp/hn-src/HamNavigator-kildekode
          mkdir -p /tmp/hn-build
          cd /tmp/hn-build
          export CCACHE_DIR=/tmp/hn-ccache
          qmake /tmp/hn-src/HamNavigator-kildekode/HamNavigatorPi.pro 'QMAKE_CXX=ccache g++'
          make -j4 > /tmp/compile.log 2>&1 || { grep -iE 'error:|fatal|no rule|undefined reference|not found' /tmp/compile.log | head -80; exit 1; }
          file bin/HamNavigator
          for lang in nb en sv; do HAMNAVIGATOR_LANGUAGE=$lang QT_QPA_PLATFORM=offscreen bin/HamNavigator --language-selftest; done
      - name: Package and test
        run: |
          python3 raspberry-pi/package.py /tmp/hn-build/bin/HamNavigator
          apt-get install -y --no-install-recommends ./raspberry-pi/dist/*.deb
          sh raspberry-pi/test-installed.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HamNavigator-Portable-arm64
          path: raspberry-pi/dist/*
          if-no-files-found: error
